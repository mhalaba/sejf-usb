name: Wydanie

# Uruchamiane wypchnięciem tagu, np.: git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Testy
        run: STRICT=0 ./build.sh test

      - name: Budowa i paczka z sumami kontrolnymi
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="SejfUSB-$VERSION"
          mkdir -p "dist/$PKG/Dokumentacja"
          STRICT=0 DEST="dist/$PKG/Aplikacja" ./build.sh
          ditto Docs "dist/$PKG/Dokumentacja"
          cp README.md README.en.md LICENSE "dist/$PKG/"
          (cd "dist/$PKG" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS.txt)
          (cd dist && ditto -c -k --keepParent "$PKG" "$PKG.zip" && shasum -a 256 "$PKG.zip" > "$PKG.zip.sha256")

      - name: Publikacja wydania
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/SejfUSB-$VERSION.zip" "dist/SejfUSB-$VERSION.zip.sha256" \
            --title "Sejf USB $VERSION" --notes-file Docs/CHANGELOG.md
